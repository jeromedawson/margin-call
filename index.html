<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0f14" />
<meta name="description" content="Flappy Bird for day traders. Tap to buy the dip." />
<title>Margin Call — Day Trader Flappy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f14'/%3E%3Crect x='22' y='14' width='20' height='36' rx='3' fill='%2300c853'/%3E%3Crect x='30' y='6' width='4' height='10' fill='%2300c853'/%3E%3Crect x='30' y='48' width='4' height='10' fill='%2300c853'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --green: #00c853;
    --red: #ff1744;
    --amber: #ffc107;
    --muted: #8b9bb4;
    --line: #1e2a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: #e8eef7;
    font-family: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  header {
    width: min(420px, 100%);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  header h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
  }
  header .sub { font-size: 11px; color: var(--muted); }
  #stage {
    position: relative;
    width: min(420px, 100%);
    aspect-ratio: 9 / 16;
    max-height: calc(100dvh - 100px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    flex: 1 1 auto;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    touch-action: none;
  }
  footer {
    width: min(420px, 100%);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.4;
    flex-shrink: 0;
  }
  @media (max-width: 480px) {
    header .sub { display: none; }
    footer { font-size: 10px; }
    #stage {
      width: 100%;
      max-height: calc(100dvh - 72px);
      border-radius: 10px;
    }
  }
  @media (display-mode: standalone), (max-height: 700px) {
    header { margin-top: 0; }
    footer kbd { display: none; }
  }
  footer kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #0f1520;
    color: #c9d4e6;
    font-size: 10px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <header>
      <h1>Margin Call</h1>
      <div class="sub">Day trader edition</div>
    </header>
    <div id="stage"><canvas id="c"></canvas></div>
    <footer>
      Tap anywhere to buy the dip.<br />
      Clear candle gaps. Don't blow the account.<br />
      <span style="opacity:.75">Add to Home Screen for fullscreen play.</span>
    </footer>
  </div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  const W = 360;
  const H = 640;
  canvas.width = W;
  canvas.height = H;

  const GRAVITY = 0.32;
  const FLAP = -6.4;
  const PIPE_W = 56;
  const GAP_BASE = 158;
  const PIPE_SPEED = 2.35;
  const PIPE_EVERY = 1650;
  const GROUND = 48;

  const tickers = ["SPY", "QQQ", "NVDA", "TSLA", "AAPL", "AMD", "BTC", "ETH", "META", "GOOG"];
  const slogans = [
    "BUY THE DIP",
    "HODL?",
    "DIAMOND HANDS",
    "NOT FINANCIAL ADVICE",
    "YOLO",
    "RISK ON",
    "FOMO",
    "FADE THE MOVE",
  ];

  let state = "ready"; // ready | playing | dead
  let trader, pipes, particles, score, best, equity, tick, lastPipe, flash, shake, slogan;
  let chartLines = [];
  let bgCandles = [];

  function loadBest() {
    try { return Number(localStorage.getItem("marginCallBest") || 0); }
    catch { return 0; }
  }
  function saveBest(n) {
    try { localStorage.setItem("marginCallBest", String(n)); } catch {}
  }
  best = loadBest();

  function reset() {
    trader = {
      x: 88,
      y: H * 0.42,
      vy: 0,
      r: 14,
      rot: 0,
      wing: 0,
    };
    pipes = [];
    particles = [];
    score = 0;
    equity = 10000;
    tick = 0;
    lastPipe = 0;
    flash = 0;
    shake = 0;
    slogan = slogans[Math.floor(Math.random() * slogans.length)];
    chartLines = Array.from({ length: 24 }, (_, i) => ({
      x: i * 18,
      y: H * 0.55 + Math.sin(i * 0.7) * 40 + (Math.random() - 0.5) * 20,
    }));
    bgCandles = Array.from({ length: 18 }, (_, i) => makeBgCandle(i * 22 - 10));
    state = "ready";
  }

  function makeBgCandle(x) {
    const open = H * 0.3 + Math.random() * H * 0.35;
    const close = open + (Math.random() - 0.5) * 70;
    const high = Math.min(open, close) - 10 - Math.random() * 20;
    const low = Math.max(open, close) + 10 + Math.random() * 20;
    return { x, open, close, high, low, green: close < open };
  }

  function spawnPipe() {
    const gap = GAP_BASE - Math.min(42, score * 2.2);
    const minTop = 70;
    const maxTop = H - GROUND - gap - 70;
    const top = minTop + Math.random() * (maxTop - minTop);
    const ticker = tickers[Math.floor(Math.random() * tickers.length)];
    const bullish = Math.random() > 0.45;
    pipes.push({
      x: W + 10,
      top,
      gap,
      passed: false,
      ticker,
      bullish,
      wick: 10 + Math.random() * 18,
    });
  }

  function flap() {
    if (state === "ready") {
      state = "playing";
      lastPipe = performance.now();
      spawnPipe();
    }
    if (state === "playing") {
      trader.vy = FLAP;
      trader.wing = 8;
      burst(trader.x - 6, trader.y + 4, "#00c853", 5);
    } else if (state === "dead") {
      reset();
    }
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4 - 1,
        life: 20 + Math.random() * 16,
        color,
        size: 2 + Math.random() * 2,
      });
    }
  }

  function die() {
    if (state !== "playing") return;
    state = "dead";
    flash = 12;
    shake = 14;
    burst(trader.x, trader.y, "#ff1744", 18);
    burst(trader.x, trader.y, "#ffc107", 10);
    if (score > best) {
      best = score;
      saveBest(best);
    }
  }

  function hitPipe(p) {
    const tr = trader;
    const left = p.x;
    const right = p.x + PIPE_W;
    if (tr.x + tr.r < left || tr.x - tr.r > right) return false;
    const gapTop = p.top;
    const gapBot = p.top + p.gap;
    if (tr.y - tr.r < gapTop || tr.y + tr.r > gapBot) return true;
    return false;
  }

  function update(now) {
    tick++;
    if (flash > 0) flash--;
    if (shake > 0) shake--;

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    // scroll chart backdrop
    for (const c of bgCandles) {
      c.x -= 0.4;
      if (c.x < -24) {
        c.x = W + Math.random() * 20;
        Object.assign(c, makeBgCandle(c.x));
      }
    }
    for (const pt of chartLines) {
      pt.x -= 0.55;
    }
    if (chartLines[0] && chartLines[0].x < -18) {
      chartLines.shift();
      const last = chartLines[chartLines.length - 1];
      chartLines.push({
        x: last.x + 18,
        y: Math.max(80, Math.min(H - GROUND - 40, last.y + (Math.random() - 0.5) * 28)),
      });
    }

    if (state === "ready") {
      trader.y = H * 0.42 + Math.sin(tick / 14) * 6;
      trader.rot = 0;
      return;
    }

    if (state === "dead") {
      trader.vy += GRAVITY * 1.2;
      trader.y += trader.vy;
      trader.rot = Math.min(1.4, trader.rot + 0.08);
      return;
    }

    // playing
    trader.vy += GRAVITY;
    trader.y += trader.vy;
    trader.rot = Math.max(-0.6, Math.min(1.1, trader.vy / 10));
    if (trader.wing > 0) trader.wing--;

    if (trader.y + trader.r >= H - GROUND || trader.y - trader.r <= 0) {
      die();
      return;
    }

    if (now - lastPipe > PIPE_EVERY - Math.min(500, score * 25)) {
      spawnPipe();
      lastPipe = now;
    }

    for (const p of pipes) {
      p.x -= PIPE_SPEED + Math.min(1.4, score * 0.04);
      if (!p.passed && p.x + PIPE_W < trader.x - trader.r) {
        p.passed = true;
        score++;
        equity += 250 + score * 40;
        burst(trader.x + 10, trader.y, "#00c853", 8);
        slogan = slogans[Math.floor(Math.random() * slogans.length)];
      }
      if (hitPipe(p)) {
        die();
        return;
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 20);
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = "rgba(30,42,58,0.7)";
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H - GROUND);
      ctx.stroke();
    }
    for (let y = 0; y < H - GROUND; y += 24) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBgCandles() {
    for (const c of bgCandles) {
      ctx.save();
      ctx.globalAlpha = 0.18;
      const col = c.green ? "#00c853" : "#ff1744";
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 1;
      const mid = c.x + 5;
      ctx.beginPath();
      ctx.moveTo(mid, c.high);
      ctx.lineTo(mid, c.low);
      ctx.stroke();
      const top = Math.min(c.open, c.close);
      const h = Math.max(2, Math.abs(c.close - c.open));
      ctx.fillRect(c.x, top, 10, h);
      ctx.restore();
    }

    // line chart
    if (chartLines.length > 1) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = "#4fc3f7";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      chartLines.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawGround() {
    ctx.fillStyle = "#0a1018";
    ctx.fillRect(0, H - GROUND, W, GROUND);
    ctx.strokeStyle = "#1e2a3a";
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND);
    ctx.lineTo(W, H - GROUND);
    ctx.stroke();

    // ticker tape
    ctx.fillStyle = "#8b9bb4";
    ctx.font = "10px Menlo, Consolas, monospace";
    const tape = "  SPY +0.42%   QQQ −0.18%   NVDA +1.2%   TSLA −0.7%   BTC +0.9%   ";
    const offset = (tick * 0.8) % 280;
    ctx.fillText(tape + tape, -offset, H - 18);
  }

  function drawPipe(p) {
    const bodyCol = p.bullish ? "#00c853" : "#ff1744";
    const dim = p.bullish ? "#007a32" : "#9a0f2a";

    // top candle body
    ctx.fillStyle = dim;
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillStyle = bodyCol;
    ctx.fillRect(p.x + 4, Math.max(0, p.top - 28), PIPE_W - 8, 28);

    // top wick
    ctx.fillStyle = bodyCol;
    ctx.fillRect(p.x + PIPE_W / 2 - 2, Math.max(0, p.top - 28 - p.wick), 4, p.wick);

    // bottom candle body
    const botY = p.top + p.gap;
    ctx.fillStyle = dim;
    ctx.fillRect(p.x, botY, PIPE_W, H - GROUND - botY);
    ctx.fillStyle = bodyCol;
    ctx.fillRect(p.x + 4, botY, PIPE_W - 8, 28);

    // bottom wick
    ctx.fillRect(p.x + PIPE_W / 2 - 2, botY + 28, 4, p.wick);

    // labels
    ctx.fillStyle = "#0b0f14";
    ctx.font = "bold 11px Menlo, Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText(p.ticker, p.x + PIPE_W / 2, p.top - 10);
    ctx.fillText(p.bullish ? "LONG" : "SHORT", p.x + PIPE_W / 2, botY + 18);

    // gap glow
    ctx.save();
    const g = ctx.createLinearGradient(p.x, p.top, p.x + PIPE_W, p.top + p.gap);
    g.addColorStop(0, "rgba(255,193,7,0.05)");
    g.addColorStop(0.5, "rgba(255,193,7,0.12)");
    g.addColorStop(1, "rgba(255,193,7,0.05)");
    ctx.fillStyle = g;
    ctx.fillRect(p.x, p.top, PIPE_W, p.gap);
    ctx.restore();
  }

  function drawTrader() {
    const t = trader;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);

    // body — bull candle / trader
    ctx.fillStyle = "#121821";
    ctx.strokeStyle = "#00c853";
    ctx.lineWidth = 2;
    roundRect(-12, -14, 28, 28, 6);
    ctx.fill();
    ctx.stroke();

    // green fill like a bull candle
    ctx.fillStyle = "#00c853";
    ctx.fillRect(-8, -10, 20, 20);

    // wick
    ctx.fillStyle = "#00c853";
    ctx.fillRect(-1.5, -22, 3, 8);
    ctx.fillRect(-1.5, 10, 3, 8);

    // eye
    ctx.fillStyle = "#0b0f14";
    ctx.beginPath();
    ctx.arc(6, -2, 2.4, 0, Math.PI * 2);
    ctx.fill();

    // wing / order ticket
    const wingY = t.wing > 0 ? -8 : 2;
    ctx.fillStyle = "#ffc107";
    ctx.beginPath();
    ctx.moveTo(-10, 0);
    ctx.lineTo(-22, wingY);
    ctx.lineTo(-10, 6);
    ctx.closePath();
    ctx.fill();

    // $ badge
    ctx.fillStyle = "#0b0f14";
    ctx.font = "bold 10px Menlo, Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText("$", 2, 4);

    ctx.restore();
  }

  function drawHUD() {
    // top bar
    ctx.fillStyle = "rgba(11,15,20,0.72)";
    ctx.fillRect(0, 0, W, 52);

    ctx.fillStyle = "#8b9bb4";
    ctx.font = "10px Menlo, Consolas, monospace";
    ctx.textAlign = "left";
    ctx.fillText("P&L TICKS", 14, 18);
    ctx.fillStyle = "#00c853";
    ctx.font = "bold 22px Menlo, Consolas, monospace";
    ctx.fillText(String(score), 14, 42);

    ctx.textAlign = "right";
    ctx.fillStyle = "#8b9bb4";
    ctx.font = "10px Menlo, Consolas, monospace";
    ctx.fillText("EQUITY", W - 14, 18);
    ctx.fillStyle = equity >= 10000 ? "#00c853" : "#ff1744";
    ctx.font = "bold 14px Menlo, Consolas, monospace";
    ctx.fillText("$" + equity.toLocaleString("en-CA"), W - 14, 40);

    if (state === "playing" || state === "ready") {
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,193,7,0.85)";
      ctx.font = "bold 11px Menlo, Consolas, monospace";
      ctx.fillText(slogan, W / 2, 70);
    }

    if (best > 0) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#8b9bb4";
      ctx.font = "10px Menlo, Consolas, monospace";
      ctx.fillText("ATH " + best, W / 2, H - GROUND - 10);
    }
  }

  function drawOverlay() {
    if (state === "ready") {
      ctx.fillStyle = "rgba(11,15,20,0.55)";
      ctx.fillRect(0, H * 0.28, W, 150);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffc107";
      ctx.font = "bold 22px Menlo, Consolas, monospace";
      ctx.fillText("OPEN POSITION", W / 2, H * 0.38);
      ctx.fillStyle = "#e8eef7";
      ctx.font = "13px Menlo, Consolas, monospace";
      ctx.fillText("Tap to buy the dip", W / 2, H * 0.38 + 28);
      ctx.fillStyle = "#8b9bb4";
      ctx.font = "11px Menlo, Consolas, monospace";
      ctx.fillText("Fly through the candle gaps", W / 2, H * 0.38 + 52);
      ctx.fillText("Miss and it's a margin call", W / 2, H * 0.38 + 70);
    }

    if (state === "dead") {
      ctx.fillStyle = "rgba(11,15,20,0.72)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff1744";
      ctx.font = "bold 26px Menlo, Consolas, monospace";
      ctx.fillText("MARGIN CALL", W / 2, H * 0.36);
      ctx.fillStyle = "#e8eef7";
      ctx.font = "14px Menlo, Consolas, monospace";
      ctx.fillText("Ticks cleared: " + score, W / 2, H * 0.36 + 36);
      ctx.fillStyle = "#00c853";
      ctx.font = "13px Menlo, Consolas, monospace";
      ctx.fillText("All-time high: " + best, W / 2, H * 0.36 + 58);
      ctx.fillStyle = "#ffc107";
      ctx.font = "bold 13px Menlo, Consolas, monospace";
      ctx.fillText("Tap to reopen", W / 2, H * 0.36 + 96);
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,23,68,${flash / 18})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 30);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    update(now);
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    ctx.fillStyle = "#0b0f14";
    ctx.fillRect(-10, -10, W + 20, H + 20);
    drawGrid();
    drawBgCandles();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawTrader();
    drawParticles();
    drawHUD();
    drawOverlay();
    ctx.restore();
    requestAnimationFrame(frame);
  }

  function onInput(e) {
    if (e.cancelable) e.preventDefault();
    flap();
  }

  // pointerdown covers mouse + touch + pen (avoid also binding touchstart or flaps fire twice)
  canvas.addEventListener("pointerdown", onInput, { passive: false });
  document.addEventListener("touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.key === " ") {
      e.preventDefault();
      flap();
    }
  });
  // Stop iOS bounce / pull-to-refresh while playing
  document.body.addEventListener("gesturestart", (e) => e.preventDefault());

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
